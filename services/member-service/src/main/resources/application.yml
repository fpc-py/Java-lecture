spring:
  application:
    name: polaris-member-service
  datasource:
    url: jdbc:mysql://localhost:13306/polaris_member?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:polaris}
    password: ${DB_PASSWORD:polaris}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 18086
  shutdown: graceful

polaris:
  mode: ${POLARIS_MODE:local}
  data:
    crypto:
      # 生产必须来自 KMS；案例用环境变量注入。32 字节密钥的 Base64（AES-256）
      # 生成：openssl rand -base64 32
      # 下面这个默认值只用于本地演示，它是公开的 —— 正因为它公开，所以叫 dev-only
      key: ${POLARIS_CRYPTO_KEY:cG9sYXJpcy1kZXYtb25seS0zMmJ5dGUta2V5LTAwMDE=}
      # 密钥版本号写进密文前缀 v1:...，轮换密钥时新旧密文可共存
      version: ${POLARIS_CRYPTO_VERSION:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.polaris.trade: INFO
