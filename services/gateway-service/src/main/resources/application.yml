spring:
  application:
    name: polaris-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      timeout: 200ms
  cloud:
    gateway:
      # 不允许客户端自己指定 Host 头，避免 SSRF / 缓存投毒
      default-filters:
        - RemoveRequestHeader=Host
      httpclient:
        # 连接超时必须显式配：默认值是"无限等"，池子耗尽时表现为整个网关卡死
        connect-timeout: 500
        response-timeout: 3s
        pool:
          max-connections: 500
          max-idle-time: 30s
      routes:
        # ---------- 订单域：绞杀者双路由 ----------
        # 同一个 path 有两条路由，靠 CanaryRouteFilter 注入的 X-Route-Version 头区分。
        # 案例里两条都指向同一个实例（便于本地跑通），生产上 v1 指向遗留系统、
        # v2 指向新服务，切流比例由 polaris.gateway.canary.weight 控制。
        - id: order-v2
          uri: ${ORDER_URL:http://localhost:18082}
          predicates:
            - Path=/api/order/**
            - Header=X-Route-Version, v2
        - id: order-v1
          uri: ${ORDER_LEGACY_URL:http://localhost:18082}
          predicates:
            - Path=/api/order/**
            - Header=X-Route-Version, v1
        # ---------- 其他域 ----------
        - id: stock
          uri: ${STOCK_URL:http://localhost:18083}
          predicates:
            - Path=/api/stock/**
        - id: pay
          uri: ${PAY_URL:http://localhost:18085}
          predicates:
            - Path=/api/pay/**
        - id: member
          uri: ${MEMBER_URL:http://localhost:18086}
          predicates:
            - Path=/api/member/**
        - id: promotion
          uri: ${PROMOTION_URL:http://localhost:18084}
          predicates:
            - Path=/api/promotion/**

server:
  port: 18070
  shutdown: graceful

polaris:
  gateway:
    canary:
      enabled: ${CANARY_ENABLED:false}
      # 10 / 90 切流：先 10% 用户走新链路，观察 24h 后再加到 50、100
      weight: ${CANARY_WEIGHT:10}
      sticky: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.polaris.trade: INFO
    org.springframework.cloud.gateway: INFO
