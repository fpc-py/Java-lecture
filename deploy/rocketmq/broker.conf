# ============================================================
# RocketMQ Broker 配置（案例版）
#
# 与默认配置的三处差别，每一处都对应一个"默认值会坑你"的场景：
# ============================================================

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
# 消息保留 72 小时（案例按 3 天，便于"隔天再复现"同一个现场）
fileReservedTime = 72

# ---- 1. 角色 ----
# ASYNC_MASTER：异步复制。同步复制（SYNC_MASTER）会把每次发送的延迟
# 绑死在从节点磁盘上，压力测试时能直接看到 P99 翻倍。
# 代价是主节点宕机可能丢少量消息 —— 案例用本地消息表（outbox）兜底，
# 这也正是"不要假设 MQ 不丢消息"的工程解法。
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# ---- 2. 自动建 Topic ----
# 默认 true。生产上必须关掉：否则一个拼错的 Topic 名会自动创建一个新 Topic，
# 消息发出去"成功"了，但没有任何消费者 —— 这种故障零报错、只丢数据。
# 案例里打开是为了本地跑通，注释里必须写明这是被放宽的约束。
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# ---- 3. 名字服务与端口 ----
namesrvAddr = rocketmq-namesrv:9876

# listenPort 与 brokerIP1 这一对，是本案例最容易踩的坑，值得完整说一遍：
#
# Broker 启动时会把自己的 "brokerIP1:listenPort" 注册到 namesrv，客户端拿到这个
# 地址后**直接去连它**，而不是连 namesrv。所以这两个值必须是"客户端视角可达"的地址。
#
# 踩过的两种错法：
#   1) 不配 brokerIP1 → 注册的是容器内网 IP（172.26.0.5），
#      宿主机上的应用连得上 namesrv、却连不上 broker，
#      报 "connect to 172.26.0.5:10911 failed"
#   2) 配成容器名 rocketmq-broker → 宿主机没有这条 DNS，
#      报 "UnknownHostException: rocketmq-broker"
#
# 案例的部署形态是"中间件在容器里、应用跑在宿主机"，所以两个值都必须是宿主机的：
#   listenPort 用容器内端口 18911，compose 里映射 18911:18911（内外同号，不换算）
#   brokerIP1 用 127.0.0.1
# 如果将来把应用也放进 compose（micro 全容器化），brokerIP1 要改回服务名。
listenPort = 18911
brokerIP1 = 127.0.0.1

# ---- 消费相关 ----
# 单条消息最大 4MB：默认也是 4MB，但很多团队不知道，
# 于是把整个商品列表塞进消息体，直到线上抛 "message body size over limit"
maxMessageSize = 4194304

# 消费线程数：案例的消费者都是"单条 DB 写"，不需要高并发
sendMessageThreadPoolNums = 4
pullMessageThreadPoolNums = 8
